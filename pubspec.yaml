name: fittracker
description: "A comprehensive fitness tracking application with nutrition monitoring, workout logging, and achievement systems."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  
  # Local Storage
  shared_preferences: ^2.2.2
  
  # UI Components
  cupertino_icons: ^1.0.6
  google_fonts: ^7.0.0
  
  # Localization
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  
  # HTTP & API
  http: ^1.1.0
  dio: ^5.4.0
  
  # Charts & Graphs
  fl_chart: ^1.1.1
  syncfusion_flutter_charts: ^32.1.22
  
  # Images & Media
  image_picker: ^1.0.4
  cached_network_image: ^3.3.0
  
  # Animations
  lottie: ^3.3.2
  animations: ^2.0.8
  
  # Utils
  uuid: ^4.2.1
  path_provider: ^2.1.1
  
  # Camera & QR Code
  mobile_scanner: ^5.0.0
  camera: ^0.11.3
  
  # Notifications
  flutter_local_notifications: ^19.5.0
  
  # Permissions
  permission_handler: ^12.0.1
  
  # Date & Time
  table_calendar: ^3.0.9
  
  # PDF Generation (for reports)
  pdf: ^3.10.7
  printing: ^5.12.0
  
  # Connectivity
  connectivity_plus: ^7.0.0
  
  # Device Info
  device_info_plus: ^12.3.0
  
  # Package Info
  package_info_plus: ^9.0.0
  flutter_bloc: ^9.1.1
  equatable: ^2.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  
 